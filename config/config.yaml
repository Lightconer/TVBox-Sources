# 直播源自动更新配置

# ------------------------------------------------------------
# 上游数据源：每 4 小时更新（UTC 0/4/8/12/16/20 的 :10 左右）
# raw 链接带时间戳绕过缓存；Actions 错峰在 :50 跑
# ------------------------------------------------------------
upstream:
  name: "上游主源"
  repo: "primary-upstream"   # 仅用于 status.json 展示；实际查询走下方 api
  branch: "master"
  file: "tv/iptv4.m3u"
  api: "https://api.github.com/repos/vbskycn/iptv/commits?path=tv/iptv4.m3u&per_page=1"
  check: true           # 运行时查询上游最新 commit，写入 status.json.upstream
  cache_bust: true      # 下载时给 raw 链接加 ?t=<epoch>，强制拿到最新内容
  stale_warn_minutes: 360  # 上游超过 6h 未更新则告警（写入 status.json，不影响产出）
  # 官方直链（备用参考，实际抓取用 crawl.sources 中配置的地址）
  official:
    txt: "https://live.zbds.top/tv/iptv4.txt"
    m3u: "https://live.zbds.top/tv/iptv4.m3u"

crawl:
  # 数据源（m3u / m3u8 / txt / json）
  # 规则：优先 GitHub raw，失败自动降级 jsdelivr；显式 mirror 作为最后兜底
  # enabled: false 表示已失效或按需停用的源
  request:
    timeout: 12
    retries: 1
    max_size: 20
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
    # 明确排除占位符/本地示例地址
    exclude_url_patterns:
      - "127\\.0\\.0\\.1"
      - "192\\.168\\."
      - "你的服务器IP"
      - "example\\.com"

  workers: 6   # 并发爬取源数量（与 check.workers 独立）

  sources:
    # 上游主源，带台标和 EPG；放首位，去重时优先保留
    - name: "IPTV4 主源(带台标EPG)"
      url: "https://raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/iptv4.m3u"
      mirror: "https://live.zbds.top/tv/iptv4.m3u"  # 官方 CDN：max-age=0 无缓存，raw 失败时兜底
      no_mirror: true      # 不用 jsdelivr 镜像（缓存 12h）
      cache_bust: true     # 加时间戳绕过 CDN 缓存
      enabled: true
    - name: "IPTV4 TXT(备份)"
      url: "https://raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/iptv4.txt"
      mirror: "https://live.zbds.top/tv/iptv4.txt"  # 同上，官方 CDN 兜底
      no_mirror: true
      cache_bust: true
      enabled: true
    # IPv6 源当前仅 3 行占位内容（上游已说明大多关闭），默认停用，需要时自行开启
    - name: "[IPv6暂空] IPTV6"
      url: "https://raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/iptv6.m3u"
      no_mirror: true
      cache_bust: true
      enabled: false

    # ---------- 来自 Lightconer/TVBox-Sources（已验证） ----------
    - name: "iptv-org 中国频道"
      url: "https://iptv-org.github.io/iptv/countries/cn.m3u"
      enabled: true
    - name: "fanmingming 央视/卫视高清(IPv4)"
      url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/index.m3u"
      enabled: true
    - name: "fanmingming 综合源(央视/卫视/地方/付费)"
      url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/itv.m3u"
      enabled: true
    - name: "fanmingming IPv6专用"
      url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u"
      enabled: true   # 无 IPv6 宽带可改为 false
    - name: "best-fan 每日检测"
      url: "https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_all.m3u8"
      enabled: true

    # ---------- 其他公开源（已验证可用） ----------
    - name: "myernestlu 国内直播源"
      url: "https://myernestlu.github.io/zby.txt"
      enabled: true
    - name: "zbefine 直播源"
      url: "https://raw.githubusercontent.com/zbefine/iptv/main/iptv.m3u"
      enabled: true
    - name: "茶客源"
      url: "https://raw.githubusercontent.com/vamoschuck/TV/main/M3U"
      enabled: true
    - name: "YueChan 直播源"
      url: "https://raw.githubusercontent.com/YueChan/Live/main/IPTV.m3u"
      mirror: "https://testingcf.jsdelivr.net/gh/YueChan/Live@main/IPTV.m3u"
      enabled: true
    - name: "BigBigGrandG 集合源(部分IPv6)"
      url: "https://raw.githubusercontent.com/BigBigGrandG/IPTV-URL/release/Gather.m3u"
      enabled: true
    - name: "Kimentanm 集合源(部分IPv6)"
      url: "https://raw.githubusercontent.com/Kimentanm/aptv/master/m3u/iptv.m3u"
      enabled: true
    - name: "YanG 集合源(部分IPv6)"
      url: "https://raw.githubusercontent.com/YanG-1989/m3u/main/Gather.m3u"
      enabled: true
    - name: "iptv-org 中国台湾频道"
      url: "https://iptv-org.github.io/iptv/countries/tw.m3u"
      enabled: true
    - name: "gitee xxy002 直播源"
      url: "https://gitee.com/xxy002/zhiboyuan/raw/master/dsy"
      enabled: true

    # iptv-org 全球总索引：约 1.1 万条，全收会把测速拖成几十分钟，
    # 所以只挑 tvg-id 国家码为 CN/HK/TW/MO 的（约 220 条），用来补港澳的小台。
    # 放在列表最后当补漏源：URL 去重时其它源的中文台名优先，不会被英文名顶掉。
    - name: "iptv-org 全球索引(港澳台+大陆)"
      url: "https://raw.githubusercontent.com/iptv-org/iptv/gh-pages/index.m3u"
      timeout: 30          # 2.6MB，给足下载时间
      # jsdelivr 兜底；raw 的 gh-pages 是站点实际构建产物，最新
      filters:
        include_id: ["\\.(cn|hk|tw|mo)@"]
      # 按国家码写中文地区名，分组才能认出 Jade/ViuTV/TDM 这类英文台名
      country_group:
        cn: "中国大陆"
        hk: "香港"
        tw: "台湾"
        mo: "澳门"
      enabled: true

    # ---------- 已失效的源，默认停用 ----------
    - name: "[已失效] Ftindy 百视通"
      url: "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/bestv.m3u"
      enabled: false
    - name: "[已失效] Ftindy 重庆广电"
      url: "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/cqyx.m3u"
      enabled: false
    - name: "[已失效] Ftindy 阳泉广电"
      url: "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/yqgd.m3u"
      enabled: false
    - name: "[已失效] Ftindy 河北广电"
      url: "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/hbgd.m3u"
      enabled: false
    - name: "[已失效] Ftindy 国内4K/8K"
      url: "https://raw.githubusercontent.com/Ftindy/IPTV-URL/main/IPTV.m3u"
      enabled: false
    - name: "[已失效] xxy.free.hr"
      url: "https://xxy.free.hr/YIPTV.m3u"
      enabled: false
    - name: "[已失效] iptv.228088.xyz"
      url: "https://iptv.228088.xyz/cn.m3u"
      enabled: false
    - name: "[已失效] whpsky 国内频道"
      url: "https://raw.githubusercontent.com/whpsky/iptv/main/chinatv.m3u"
      enabled: false
    - name: "[已失效] fanmingming v6"
      url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/v6.m3u"
      enabled: false
    - name: "[已失效] zhanghongguang IPv6"
      url: "https://raw.githubusercontent.com/zhanghongguang/zhanghongguang.github.io/main/IPV6_IPTV.m3u"
      enabled: false

    # ---------- 海外/测试源，默认停用（需要可自行启用） ----------
    - name: "[海外] epg.pw 中国频道测试"
      url: "https://epg.pw/test_channels.m3u"
      enabled: false
    - name: "[海外] epg.pw 中国香港测试"
      url: "https://epg.pw/test_channels_hong_kong.m3u"
      enabled: false
    - name: "[海外] epg.pw 中国澳门测试"
      url: "https://epg.pw/test_channels_macau.m3u"
      enabled: false
    - name: "[海外] epg.pw 中国台湾测试"
      url: "https://epg.pw/test_channels_taiwan.m3u"
      enabled: false
    - name: "[海外] waiguotai"
      url: "https://kan.waiguotai.top/other.m3u"
      enabled: false

  filters:
    include_groups: []
    exclude_groups: []
    include_keywords: []
    exclude_keywords:
      - "测试"
      - "test"
      - "广告"
      - "演示"
      - "预告"
      - "失效"
      - "暂停"
      - "停播"
      - "geo-blocked"
      - "not 24/7"
      - "offline"
      - "blocked"
      - "unavailable"
    exclude_channels:
      - "cctv-women's fashion"
      - "cctv-the first theater"
      - "cctv-world geography"
      - "cctv-storm theater"
      - "cctv-storm football"
      - "cctv-storm music"
      - "cctv-culture of quality"
      - "cctv-weapon"
      - "cctv-health"
      - "cctv-golf"
      - "cctv-nostalgia theater"
      - "cctv-billiards"
      # cctv-8k 已放开：按模板要求在「4K超高清」分组中保留
      - "cgtn西语"
      - "cgtn法语"
      - "cgtn俄语"
      # iptv-org 索引里的同义英文台名，与上面三个重复
      - "cgtn spanish"
      - "cgtn french"
      - "cgtn russian"
      - "cgtn arabic"
      # 纯广播（音频流）不进电视列表
      - "河北广播"
      - "河北交通广播"
      - "河北文艺广播"
      - "河北生活广播"
      - "河北经济广播"
      - "江苏城市"
      - "anshun"
    country: ""
    allowed_schemes: ["http", "https"]

check:
  enabled: true             # 是否测速
  workers: 30
  connect_timeout: 5
  read_timeout: 8
  ffprobe_timeout: 10
  require_ffprobe: true
  min_score: 30
  max_per_group: 60
  max_urls_per_channel: 8
  # 同频道多线路：先按画质档位、再按速度排序；无 1080p+ 时自动降级用低画质源
  quality_first: true       # true=画质优先  false=纯速度优先
  preferred_min_tier: 4     # 期望最低档位 4=1080p；仅用于降级提示，不过滤源

output:
  dir: "output"
  formats: ["m3u", "txt"]
  header:
    name: "自动更新直播源"
    # 保持本仓库地址，生成的 tvbox.json 订阅地址不变
    url: "https://github.com/Lightconer/TVBox-Sources"
    desc: "由 GitHub Actions 自动爬取+测速生成"
  epg: ""                   # 可选：EPG 订阅地址，默认留空以完全兼容原配置

  # 频道列表顶部的「更新时间」分组：播放器里打开直播就能看到这次更新到几点
  # url 只是个占位（点开不播），用来让某些播放器愿意显示这一条
  notice:
    enabled: true
    group: "更新时间"
    text: "{time} 更新 · {channels} 个频道"
    url: "http://127.0.0.1/"

  # 指定分组内部的排序（按名称前缀匹配；没写到的分组仍按频道名自然排序）
  # 河北分三档：省级台 → 各地市台 → 县级台。
  # 前缀按顺序先命中先用；没写进列表的（各县台）自动落在最后一档，按名称排。
  group_sort:
    "河北频道": ["河北卫视", "河北4K", "河北",
                 "石家庄", "唐山", "秦皇岛", "邯郸", "邢台", "保定", "张家口",
                 "承德", "沧州", "廊坊", "衡水", "定州", "辛集", "雄安"]

  # 分组在播放器里的展示顺序（没写到的分组按 rules 顺序排在后面）
  # 港澳国际你这次没列到，先保留、放在 4K 之后，要删就说一声
  group_order: ["央视频道", "卫视频道", "河北频道", "地方频道", "体育专区", "少儿频道",
                "电影剧场", "戏曲音乐", "4K超高清", "港澳国际", "其他频道"]

  # ============================================================
  # 分组：支持同一频道跨组出现
  #   · rules        = 主分组，按顺序先命中先生效，每个频道唯一主组
  #   · theme_groups = 专题组，命中即追加到 groups，实现跨组复用
  #     例：CCTV-5 主组=央视频道，同时进「体育专区」；
  #         CCTV-6 主组=央视频道，同时进「电影剧场」；
  #         河北卫视主组=河北频道，同时进「卫视频道」。
  #   · 展示顺序 = output.group_order（不写则按 rules + theme_groups 顺序）
  # ============================================================
  group_map:
    enabled: true
    multi_group: true         # 开启跨组：同一频道可出现在多个分组
    max_per_group: 0          # 专题组每组条数上限（0=不限；主组仍受 check.max_per_group 约束）

    # 主分组（先命中先生效）
    rules:
      - { group: "央视频道", pattern: "CCTV|CGTN|央视|中央|央广" }
      # 港澳国际放在卫视频道之前，避免「凤凰卫视/星空卫视」被「卫视」抢走
      # 后半段是 iptv-org 用的英文台名（Jade/ViuTV/TDM…），不收就会掉进其他频道
      - { group: "港澳国际", pattern: "凤凰卫视|凤凰资讯|Phoenix|翡翠|TVB|星空|香港|澳门|台湾|HOY|中天|东森|民视|三立|明珠|无线|华娱|本港台|亚洲台|国际台|ViuTV|Jade|TDM|Lotus|Macau|Macao|Celestial|NewsWorld|KIX|Thrill" }
      # 其余卫视（河北卫视由下一行的「河北频道」接手，这里用否定回顾让位）
      - { group: "卫视频道", pattern: "(?<!河北)卫视|Satellite" }
      # 河北单列一组，与央视/卫视同级：省级频道 + 各地市台（顺序在卫视之后、地方频道之前）
      - { group: "河北频道", pattern: "河北|石家庄|唐山|秦皇岛|邯郸|邢台|保定|张家口|承德|沧州|廊坊|衡水|雄安|定州|辛集" }
      - { group: "地方频道", pattern: "河北卫视|石家庄|唐山|秦皇岛|邯郸|邢台|保定|张家口|承德|沧州|廊坊|衡水|北京文艺|北京生活|上海都市|上海新闻|广州综合|广州新闻|新闻综合|都市频道|生活频道|公共频道|影视频道|经济频道|沈阳|大连|青岛|宁波|温州|佛山|东莞|淄博|潍坊|常州|徐州|南通|绍兴|嘉兴|金华|台州|泉州|漳州|烟台|威海|洛阳|南阳|襄阳|宜昌|株洲|湘潭|衡阳|赣州|九江|柳州|桂林|湛江|汕头|惠州|中山|珠海|肇庆|清远|韶关|梅州|揭阳|潮州|茂名|阳江|云浮|河源|汕尾" }
      - { group: "其他频道", pattern: ".*" }

    # 专题组（跨组复用：命中即追加，不影响主分组）
    theme_groups:
      - { group: "体育专区", pattern: "CCTV-?5|CCTV-?16|五星体育|广东体育|体育|赛事|劲爆|台球|高尔夫|足球|篮球|英超|西甲|德甲|欧冠|搏击|竞技" }
      - { group: "少儿频道", pattern: "CCTV-?14|少儿|卡通|动漫|Kids|Baby|优漫|炫动|动画|金鹰|卡酷|哈哈炫动" }
      - { group: "电影剧场", pattern: "CCTV-?6|CHC|电影|影院|影视|剧场|第一剧场|家庭影院|动作电影|Nostalgia" }
      - { group: "戏曲音乐", pattern: "CCTV-?11|CCTV-?15|戏曲|音乐|梨园|MV|Hi-Res|风华|魅力" }
      - { group: "4K超高清", pattern: "CCTV-?4K|CCTV-?8K|4K|8K|UHD|2160p|超高清" }
      # 河北卫视在两个组里都保留：主组是「河北频道」，这里再挂一份到「卫视频道」
      - { group: "卫视频道", pattern: "河北卫视" }
