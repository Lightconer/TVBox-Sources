# ============================================================
# TVBox / 影视仓 直播源自动更新 · 配置文件
# 修改后推送到仓库，下一次 GitHub Actions 运行即生效
# ============================================================

crawl:
  # ---------- 数据源列表（m3u / txt / json 均可，可随时增删，enabled=false 可临时停用） ----------
  # 每个源优先用 GitHub raw 直连（Actions 海外环境稳定快速）；
  # 若某源 raw 访问失败，脚本会自动降级到 jsdelivr CDN 镜像（国内可直连）。
  # 本地在国内跑时，可设环境变量 LIVE_SOURCE_PREFER_MIRROR=1 让镜像优先。
  sources:
    - name: "iptv-org 中国频道"
      url: "https://iptv-org.github.io/iptv/countries/cn.m3u"
      enabled: true
    - name: "fanmingming 央视/卫视高清(IPv4)"
      url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/index.m3u"
      enabled: true
    - name: "fanmingming 综合源(央视/卫视/地方/付费)"
      url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/itv.m3u"
      enabled: true
    - name: "fanmingming IPv6专用(国内宽带流畅)"
      url: "https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u"
      enabled: true   # 若你家宽带没有 IPv6，把这行改成 false 即可
    - name: "best-fan 每日检测(央视/卫视/体育/付费)"
      url: "https://raw.githubusercontent.com/best-fan/iptv-sources/main/cn_all.m3u8"
      enabled: true

  # ---------- 请求参数 ----------
  request:
    timeout: 12             # 单次请求超时（秒）
    retries: 1              # 失败重试次数（配合镜像降级，重试多了会拖慢 fallback）
    max_size: 20            # 单源最大下载大小（MB）
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

  # ---------- 过滤规则 ----------
  filters:
    include_groups: []       # 仅保留这些分组（小写匹配；留空=全部）。例: ["央视", "卫视"]
    exclude_groups: []       # 排除的分组，支持正则。例: ["test", "境外"]
    include_keywords: []     # 频道名需包含的关键词（留空=全部）。例: ["CCTV"]
    exclude_keywords: ["测试", "test", "广告", "演示", "预告", "失效", "暂停", "停播", "geo-blocked", "not 24/7", "offline", "blocked", "unavailable"]  # 频道名含这些词则剔除（含失效标注）
    exclude_channels: ["cctv-women's fashion", "cctv-the first theater", "cctv-world geography", "cctv-storm theater", "cctv-storm football", "cctv-storm music", "cctv-culture of quality", "cctv-weapon", "cctv-health", "cctv-golf", "cctv-nostalgia theater", "cctv-billiards", "cctv-8k", "cgtn西语", "cgtn法语", "cgtn俄语", "江苏城市", "anshun"]  # 精确黑名单：iptv-org 海外版子台等「国内实测不可用」的频道（子串匹配，小写）
    country: ""              # 按 tvg-country 过滤（如 "CN"；留空=不过滤）
    allowed_schemes: ["http", "https"]   # 只保留这些协议开头的地址

check:
  enabled: true
  workers: 30               # 并发测速线程数
  connect_timeout: 5        # TCP 连接超时（秒）
  read_timeout: 8           # 首包读取超时（秒）
  ffprobe_timeout: 10       # ffprobe 媒体探测超时（秒）
  require_ffprobe: true     # 是否强制 ffprobe 验证可播放媒体流（Actions 已装 ffmpeg）
  min_score: 30             # 最低通过分（0-100）：延迟60分+媒体有效性40分，低于则丢弃
  max_per_group: 60         # 每个分组最多保留的频道数（0=不限）
  max_urls_per_channel: 8   # 每个频道最多保留的可用地址数（多源冗余，播放失败自动切换）

output:
  dir: "output"
  formats: ["m3u", "txt"]   # 同时产出两种格式，TVBox/影视仓主要用 txt 和 m3u
  header:                   # 写入 m3u 的元信息
    name: "自动更新直播源"
    url: "https://github.com/Lightconer/TVBox-Sources"
    desc: "由 GitHub Actions 自动爬取+测速生成"

  # ---------- 频道分类：采用 iptv-api 分类方式（央视→卫视→港澳台→各省→专题） ----------
  # 规则按顺序匹配，先命中先生效；规则顺序即输出分组顺序。
  group_map:
    enabled: true
    rules:
      # 中央
      - { group: "📺央视频道", pattern: "CCTV|央视|CGTN|中央" }
      # 卫视
      - { group: "📡卫视频道", pattern: "卫视|Satellite" }
      # 港澳台
      - { group: "🌊港·澳·台", pattern: "香港|澳门|台湾|凤凰|Phoenix|翡翠|TVB|HOY|中天|东森|民视|三立|明珠|无线|华娱|本港台" }
      # 各省（每省独立分组，顺序即输出顺序）
      - { group: "☘️北京频道", pattern: "北京|Beijing|BTV|BRTV|卡酷" }
      - { group: "☘️天津频道", pattern: "天津|Tianjin" }
      - { group: "☘️上海频道", pattern: "上海|Shanghai|上海东方" }
      - { group: "☘️重庆频道", pattern: "重庆|Chongqing" }
      - { group: "☘️河北频道", pattern: "河北|Hebei|石家庄|唐山|秦皇岛|邯郸|邢台|保定|张家口|承德|沧州|廊坊|衡水" }
      - { group: "☘️山西频道", pattern: "山西|Shanxi" }
      - { group: "☘️内蒙古频道", pattern: "内蒙古|Inner Mongolia|Nei Monggol|Chifeng|赤峰" }
      - { group: "☘️辽宁频道", pattern: "辽宁|Liaoning|沈阳|大连" }
      - { group: "☘️吉林频道", pattern: "吉林|Jilin|Siping|四平" }
      - { group: "☘️黑龙江频道", pattern: "黑龙江|Heilongjiang|哈尔滨|Harbin" }
      - { group: "☘️江苏频道", pattern: "江苏|Jiangsu|南京|苏州|无锡" }
      - { group: "☘️浙江频道", pattern: "浙江|Zhejiang|杭州|宁波|温州" }
      - { group: "☘️安徽频道", pattern: "安徽|Anhui" }
      - { group: "☘️福建频道", pattern: "福建|Fujian|厦门" }
      - { group: "☘️江西频道", pattern: "江西|Jiangxi" }
      - { group: "☘️山东频道", pattern: "山东|Shandong|济南|青岛|QTV" }
      - { group: "☘️河南频道", pattern: "河南|Henan" }
      - { group: "☘️湖北频道", pattern: "湖北|Hubei" }
      - { group: "☘️湖南频道", pattern: "湖南|Hunan|长沙|金鹰|快乐" }
      - { group: "☘️广东频道", pattern: "广东|Guangdong|广州|Guangzhou|深圳|Shenzhen|南方|珠江|嘉佳" }
      - { group: "☘️广西频道", pattern: "广西|Guangxi" }
      - { group: "☘️海南频道", pattern: "海南|Hainan" }
      - { group: "☘️四川频道", pattern: "四川|Sichuan|成都|Kangba|康巴" }
      - { group: "☘️贵州频道", pattern: "贵州|Guizhou" }
      - { group: "☘️云南频道", pattern: "云南|Yunnan" }
      - { group: "☘️陕西频道", pattern: "陕西|Shaanxi|西安" }
      - { group: "☘️甘肃频道", pattern: "甘肃|Gansu|兰州|Lanzhou" }
      - { group: "☘️青海频道", pattern: "青海|Qinghai" }
      - { group: "☘️宁夏频道", pattern: "宁夏|Ningxia" }
      - { group: "☘️新疆频道", pattern: "新疆|Xinjiang" }
      - { group: "☘️西藏频道", pattern: "西藏|Xizang|Tibet|拉萨" }
      # 专题
      - { group: "🏀体育频道", pattern: "体育|赛事|劲爆|台球|高尔夫|Golf|足球|篮球|英超|西甲|德甲|欧冠|搏击|五星体育|竞技" }
      - { group: "🎬电影频道", pattern: "电影|CHC|影院|影视|家庭剧场|First Theater|Nostalgia" }
      - { group: "🎵音乐频道", pattern: "音乐|MV|Hi-Res|风华|魅力" }
      - { group: "🪁动画频道", pattern: "少儿|卡通|动漫|Kids|Baby|优漫|炫动|动画" }
      - { group: "🎮游戏频道", pattern: "游戏|Gaming" }
      - { group: "💰央视付费频道", pattern: "iHOT|SiTV|NewTV|哈哈|都市剧场|精品|尊享|付费" }
      - { group: "🎥咪咕直播", pattern: "咪咕|Migu|Miguvideo" }
      - { group: "🏛经典剧场", pattern: "剧场|经典|怀旧" }
      - { group: "📰新闻频道", pattern: "新闻|资讯|新华|CNN|BBC|NHK|CNA|Bloomberg|半岛|国际台" }
      - { group: "📖纪录频道", pattern: "纪录|纪实|探索|Discovery|国家地理|DOX|全纪实|World Geography" }
      - { group: "📈财经频道", pattern: "财经|第一财经|CNBC|财富" }
      - { group: "🎓科教频道", pattern: "科教|教育|学堂|科技|法治|戏曲|梨园" }
      - { group: "🛒购物频道", pattern: "购物|乐购|家有购物|东方购物" }
      # 兜底
      - { group: "📺其他频道", pattern: ".*" }
