# 频道别名表：把同一个台的各种写法归到一个名字上
#
# 一、cctv_normalize: 央视台号自动归一
#     CCTV1 / CCTV-1 / cctv 1 / 中央一台 / 央视一套 / CCTV-1 综合 → CCTV-1
#     只认「前缀 + 台号 + 尾巴」的结构，所以 CCTV-4K、CCTV-4 美洲、CCTV-1 香港
#     不会被误并进来。
#
# 二、aliases: 手工补充的别名（左边是最终显示名，右边是它的各种写法）
#     这些大多是带中文全称的写法，规律吃不掉，只能一条条列。

enabled: true
cctv_normalize: true
cctv_range: [1, 17]

aliases:
  CCTV-1:  ["中央电视台综合频道", "央视综合频道", "CCTV-1 综合频道"]
  CCTV-2:  ["中央电视台财经频道", "央视财经频道", "CCTV-2 财经频道"]
  CCTV-3:  ["中央电视台综艺频道", "央视综艺频道", "CCTV-3 综艺频道"]
  CCTV-4:  ["中央电视台中文国际频道", "央视中文国际频道", "CCTV-4 中文国际"]
  CCTV-5:  ["中央电视台体育频道", "央视体育频道", "CCTV-5 体育频道"]
  CCTV-5+: ["CCTV5+", "央视体育赛事频道", "央视体育赛事", "CCTV体育赛事频道", "CCTV-5＋"]
  CCTV-6:  ["中央电视台电影频道", "央视电影频道", "CCTV-6 电影频道"]
  CCTV-7:  ["中央电视台国防军事频道", "央视国防军事频道", "CCTV-7 国防军事"]
  CCTV-8:  ["中央电视台电视剧频道", "央视电视剧频道", "CCTV-8 电视剧频道"]
  CCTV-9:  ["中央电视台纪录频道", "央视纪录频道", "CCTV-9 纪录频道", "CCTV-9 记录频道"]
  CCTV-10: ["中央电视台科教频道", "央视科教频道", "CCTV-10 科教频道"]
  CCTV-11: ["中央电视台戏曲频道", "央视戏曲频道", "CCTV-11 戏曲频道"]
  CCTV-12: ["中央电视台社会与法频道", "央视社会与法频道", "CCTV-12 社会与法"]
  CCTV-13: ["中央电视台新闻频道", "央视新闻频道", "CCTV-13 新闻频道"]
