  CCTV-15: ["中央电视台音乐频道", "央视音乐频道", "CCTV-15 音乐频道"]
  CCTV-16: ["中央电视台奥林匹克频道", "央视奥林匹克频道", "CCTV-16 奥林匹克"]
  CCTV-17: ["中央电视台农业农村频道", "央视农业农村频道", "CCTV-17 农业农村"]
