# ============================================================
# TVBox-Sources · 直播源自动更新工作流（优化版）
#   · 定时触发：每 4 小时错峰运行（UTC 1/5/9/13/17/21 = 北京 09/13/17/21/01/05）
#     上游在 UTC 0/4/8/12/16/20 的 :10 左右推送，这里晚约 50 分钟，
#     既避开 CDN 缓存窗口，又保证每次都用上上游最新版本。
#   · Webhook 触发：repository_dispatch，上游更新可立即触发（准实时，见 README）
#   · 手动触发：Actions 页面 Run workflow（可临时关闭测速 / 限制数量）
#   · 代码或配置变更立即触发（output/ 变更不触发，避免循环）
#   · 自动提交：仅在直播源文件有实质变化时提交，附带上游 commit 信息
# ============================================================
name: IPTV 直播源自动更新（优化版）

on:
  schedule:
    # 错峰：上游推送后约 50 分钟执行，raw 缓存(5min)已过期，且避开 jsdelivr(12h)
    - cron: '50 1,5,9,13,17,21 * * *'
  # 上游 Webhook / 外部系统可立即触发一次更新（准实时，不必等定时）
  repository_dispatch:
    types: [update-sources, upstream-push]
  workflow_dispatch:
    inputs:
      skip_check:
        description: '跳过测速（快速生成）'
        type: boolean
        default: false
      limit:
        description: '仅测速前 N 个频道（0=全部）'
        type: string
        default: '0'
  push:
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/**'

concurrency:
  group: tvbox-sources-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装 ffmpeg（ffprobe 媒体校验用）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 爬取 + 测速 + 生成直播源
        env:
          # raw 直连优先（上游源已配置 no_mirror，不会走 jsdelivr 12h 缓存）
          LIVE_SOURCE_PREFER_MIRROR: '0'
        run: |
          ARGS=""
          if [ "${{ inputs.skip_check }}" = "true" ]; then ARGS="$ARGS --skip-check"; fi
          LIMIT="${{ inputs.limit }}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          python scripts/run.py --config config/config.yaml $ARGS

      - name: 校验输出文件结构
        run: python scripts/run.py --config config/config.yaml --verify-only

      - name: 记录上游状态到执行摘要
        run: |
          python - <<'PY'
          import json
          s = json.load(open("output/status.json", encoding="utf-8"))
          up = s.get("upstream", {})
          with open("GITHUB_STEP_SUMMARY_ADD", "w", encoding="utf-8") as f:
              if up.get("ok"):
                  f.write("## 🔗 上游数据源状态\n\n")
                  f.write(f"- 仓库: `{up.get('repo')}`\n")
                  f.write(f"- 文件: `{up.get('file')}`\n")
                  f.write(f"- 最新提交: `{up.get('sha')}`\n")
                  f.write(f"- 提交时间: {up.get('commit_time')}\n")
                  f.write(f"- 滞后: {up.get('lag_minutes')} 分钟\n")
                  if up.get("stale"):
                      f.write("\n> ⚠️ 上游超过阈值未更新，请留意。\n")
              else:
                  f.write("## 🔗 上游数据源状态\n\n")
                  f.write(f"- 查询未成功: {up.get('error', '未启用')}\n")
          PY
          cat GITHUB_STEP_SUMMARY_ADD >> "$GITHUB_STEP_SUMMARY"
          rm -f GITHUB_STEP_SUMMARY_ADD
          # 导出上游 sha 供提交信息使用
          UPSTREAM_SHA=$(python -c 'import json; s=json.load(open("output/status.json",encoding="utf-8")); print(s.get("upstream",{}).get("sha","unknown"))')
          echo "UPSTREAM_SHA=$UPSTREAM_SHA" >> "$GITHUB_ENV"

      - name: 提交变更（无变化则不提交）
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/live.m3u output/live.txt output/tvbox.json
          if git diff --cached --quiet; then
            echo "::notice::直播源无变化，跳过提交"
          else
            git add output/status.json output/badge.json
            git commit -m "chore: 自动更新直播源 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') (上游 ${UPSTREAM_SHA:-unknown})"
            git push
          fi

      - name: 刷新 jsdelivr CDN 缓存
        if: always()
        continue-on-error: true
        run: |
          curl -s \
            "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/output/live.txt&gh/${GITHUB_REPOSITORY}@main/output/live.m3u&gh/${GITHUB_REPOSITORY}@main/output/tvbox.json&gh/${GITHUB_REPOSITORY}@main/output/badge.json" \
            -o /dev/null -w "purge http_code=%{http_code}\n"
